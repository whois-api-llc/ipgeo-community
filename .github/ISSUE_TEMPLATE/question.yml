name: Question
description: Usage, licensing, or general questions about the community edition
title: "[q] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Quick answers live in the [README](../../blob/main/README.md),
        [SCHEMA.md](../../blob/main/SCHEMA.md), and the
        [SUPPORT.md FAQ](../../blob/main/SUPPORT.md#faq). Commercial/sales questions:
        see the contact link on the issue chooser instead. Best-effort answers, **no SLA**.
  - type: checkboxes
    id: checked
    attributes:
      label: Checked first
      options:
        - label: I looked at the README, SCHEMA.md, and the FAQ
          required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
