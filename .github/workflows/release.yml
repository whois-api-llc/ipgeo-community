name: Publish Release
# Autonomous: pulls the weekly community artifact from S3 (published by the
# private topcoder1/ipgeo_core community-build.yml) and cuts a GitHub Release.
# The publish is SELF-VERIFYING — it refuses to release an artifact that carries
# any commercial (Panavision) column, so an unattended run cannot leak the
# commercial edge even if the build regresses. (VPN/proxy flags are recomputed
# from native ASN detection in the build, so no per-row provenance check is
# needed here — the column check is the provenance-independent invariant.)
on:
  schedule:
    # Mondays 08:30 UTC. The build starts 05:30 with timeout-minutes: 60 on a
    # shared self-hosted runner, so 06:30 left zero margin — a queued or slow
    # build would trip the freshness gate and lose the week's release.
    - cron: "30 8 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Pull artifact from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          pip install awscli >/dev/null
          aws s3 sync "s3://${{ secrets.S3_BUCKET }}/community/latest/" dist/ --quiet
          test -f dist/ipgeo-community.mmdb || { echo "::error::no MMDB in S3"; exit 1; }
          test -f dist/MANIFEST.json || { echo "::error::no MANIFEST"; exit 1; }
      - name: Verify artifact boundary, freshness, checksums (fail-closed)
        run: |
          python3 - <<'PY'
          import csv, gzip
          COMMERCIAL = {"observed_country","observed_countries","observed_lat",
                        "observed_lon","confidence","source"}
          with gzip.open("dist/ipgeo-community.csv.gz","rt") as f:
              header = next(csv.reader(f))
          bad = COMMERCIAL & set(header)
          assert not bad, f"commercial columns present in community artifact: {bad}"
          # Fail closed unless a native-recompute build produced this artifact —
          # an older/leaky build lacks the marker and must NOT publish.
          import json
          man = json.load(open("dist/MANIFEST.json"))
          assert man.get("flag_provenance") == "native-asn-recomputed", \
              f"artifact not produced by a native-recompute build: {man.get('flag_provenance')!r}"
          # Freshness (audit MEDIUM-4): the S3 sync is non-atomic and this job
          # runs unattended — refuse to release a stale/partial latest/ bundle.
          import datetime
          v = man["version"]
          try:
              built = datetime.date.fromisoformat(v)
          except ValueError:
              raise SystemExit(f"::error::MANIFEST version {v!r} is not YYYY-MM-DD — refusing to release")
          age = (datetime.date.today() - built).days
          if age > 6:
              raise SystemExit(
                  f"::error::MANIFEST version {v} is {age} days old — the weekly build did not "
                  "publish a fresh artifact; refusing to release a stale bundle")
          if age < 0:
              raise SystemExit(
                  f"::error::MANIFEST version {v} is dated {-age} day(s) in the future — "
                  "clock skew or a hand-edited manifest; refusing to release")
          # Checksums (audit MEDIUM-5): every manifest-listed file must
          # hash-match what ships (CSV checksums cover decompressed content).
          # Coverage first — an empty/partial files map must not pass as "all verified".
          import hashlib, pathlib
          REQUIRED = {"ipgeo-community.mmdb", "ipgeo-community.csv"}
          files = man.get("files") or {}
          missing_req = REQUIRED - set(files)
          assert not missing_req, f"manifest omits required data files: {sorted(missing_req)}"
          def _sha(f):
              h = hashlib.sha256()
              for chunk in iter(lambda: f.read(1 << 20), b""):
                  h.update(chunk)
              return h.hexdigest()
          for name, meta in files.items():
              sha = (meta or {}).get("sha256")
              assert sha, f"manifest entry for {name} has no sha256"
              p = pathlib.Path("dist") / name
              gz = pathlib.Path("dist") / (name + ".gz")
              # Verify EVERY shipped variant: `gh release create dist/*` publishes
              # whatever is present, so checking only one of them can ship the other
              # unverified.
              checked = 0
              for path, opener in ((gz, gzip.open), (p, open)):
                  if not path.exists():
                      continue
                  with opener(path, "rb") as f:
                      got = _sha(f)
                  assert got == sha, \
                      f"checksum mismatch for {path.name}: manifest {sha[:12]}… != actual {got[:12]}…"
                  checked += 1
              assert checked, f"manifest lists {name} but neither it nor {gz.name} is in dist/"
          print(f"boundary OK; freshness OK ({v}, {age}d); all {len(files)} manifest entries verified")
          PY
      - name: Cut release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('dist/MANIFEST.json'))['version'])")
          TAG="community-${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi

          # Week-over-week deltas need the PREVIOUS release's MANIFEST. This is
          # fail-SOFT on purpose: a genuine first release — or an asset we can't
          # fetch — renders "first release" instead of a delta and must never
          # block the week's publish.
          PREV_ARGS=()
          PREV_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)
          if [ -n "$PREV_TAG" ] \
             && gh release download "$PREV_TAG" --pattern MANIFEST.json --dir prev >/dev/null 2>&1; then
            PREV_ARGS=(--prev prev/MANIFEST.json)
            echo "rendering week-over-week deltas vs $PREV_TAG"
          else
            echo "no previous MANIFEST available — rendering as first release"
          fi

          # Notes generation is fail-CLOSED: the generator validates every
          # manifest value against a strict allowlist and exits 1 on any
          # violation, so a malformed/tampered manifest stops the release
          # rather than echoing unvetted text onto a public surface.
          # --vpn-list makes the provider-named share a fresh per-build figure
          # (GTM §1.5 own-metrics freshness rule) rather than a stale constant.
          python3 scripts/gen_release_notes.py dist/MANIFEST.json \
            "${PREV_ARGS[@]}" \
            --vpn-list dist/community-vpn-list.csv.gz \
            > release-notes.md

          gh release create "$TAG" dist/* \
            --title "ipgeo Community Edition — $VERSION" \
            --notes-file release-notes.md
