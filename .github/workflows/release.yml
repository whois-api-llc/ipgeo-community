name: Publish Release
# Autonomous: pulls the weekly community artifact from S3 (published by the
# private topcoder1/ipgeo_core community-build.yml) and cuts a GitHub Release.
# The publish is SELF-VERIFYING — it refuses to release an artifact that carries
# any commercial (Panavision) column, so an unattended run cannot leak the
# commercial edge even if the build regresses. (VPN/proxy flags are recomputed
# from native ASN detection in the build, so no per-row provenance check is
# needed here — the column check is the provenance-independent invariant.)
on:
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC, after the S3 build at 05:30
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Pull artifact from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          pip install awscli >/dev/null
          aws s3 sync "s3://${{ secrets.S3_BUCKET }}/community/latest/" dist/ --quiet
          test -f dist/ipgeo-community.mmdb || { echo "::error::no MMDB in S3"; exit 1; }
          test -f dist/MANIFEST.json || { echo "::error::no MANIFEST"; exit 1; }
      - name: Verify artifact boundary, freshness, checksums (fail-closed)
        run: |
          python3 - <<'PY'
          import csv, gzip
          COMMERCIAL = {"observed_country","observed_countries","observed_lat",
                        "observed_lon","confidence","source"}
          with gzip.open("dist/ipgeo-community.csv.gz","rt") as f:
              header = next(csv.reader(f))
          bad = COMMERCIAL & set(header)
          assert not bad, f"commercial columns present in community artifact: {bad}"
          # Fail closed unless a native-recompute build produced this artifact —
          # an older/leaky build lacks the marker and must NOT publish.
          import json
          man = json.load(open("dist/MANIFEST.json"))
          assert man.get("flag_provenance") == "native-asn-recomputed", \
              f"artifact not produced by a native-recompute build: {man.get('flag_provenance')!r}"
          # Freshness (audit MEDIUM-4): the S3 sync is non-atomic and this job
          # runs unattended — refuse to release a stale/partial latest/ bundle.
          import datetime
          v = man["version"]
          age = (datetime.date.today() - datetime.date.fromisoformat(v)).days
          assert 0 <= age <= 6, \
              f"MANIFEST version {v} is {age} days old — stale S3 artifact, refusing to release"
          # Checksums (audit MEDIUM-5): every manifest-listed file must
          # hash-match what ships (CSV checksums cover decompressed content).
          import hashlib, pathlib
          def _sha(f):
              h = hashlib.sha256()
              for chunk in iter(lambda: f.read(1 << 20), b""):
                  h.update(chunk)
              return h.hexdigest()
          for name, meta in man["files"].items():
              p = pathlib.Path("dist") / name
              gz = pathlib.Path("dist") / (name + ".gz")
              if p.exists():
                  with open(p, "rb") as f:
                      got = _sha(f)
              elif gz.exists():
                  with gzip.open(gz, "rb") as f:
                      got = _sha(f)
              else:
                  raise SystemExit(f"manifest lists {name} but neither it nor {gz.name} is in dist/")
              assert got == meta["sha256"], \
                  f"checksum mismatch for {name}: manifest {meta['sha256'][:12]}… != actual {got[:12]}…"
          print(f"boundary OK; freshness OK ({v}, {age}d); all {len(man['files'])} checksums verified")
          PY
      - name: Cut release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('dist/MANIFEST.json'))['version'])")
          TAG="community-${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi
          gh release create "$TAG" dist/* \
            --title "ipgeo Community Edition — $VERSION" \
            --notes "Free IP geolocation DB (CC BY-SA 4.0). See MANIFEST.json for checksums."
